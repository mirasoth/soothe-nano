name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        # Pin to an immutable tag (v8+ no longer publishes major/minor tags).
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          # Only save the uv cache on one matrix job to avoid cache reservation
          # races between parallel jobs that compute the same key.
          save-cache: ${{ matrix.python-version == '3.12' }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep silversearcher-ag

      - name: Sync dependencies
        run: make sync

      - name: Verify soothe-sdk protocols
        run: |
          uv run python -c "from soothe_sdk.protocols.core_agent import CoreAgentCapabilities; print('soothe-sdk protocols OK')"

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test-unit

      - name: Coverage
        if: matrix.python-version == '3.12'
        run: |
          uv run pytest tests/unit/ --cov=soothe_nano --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: make sync

      - name: Build package
        run: make build

      - name: Verify package
        run: |
          uv run twine check dist/*
          echo "Package built and verified"
