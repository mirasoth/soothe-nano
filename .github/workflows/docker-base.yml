name: Docker Guest Image

# Builds and pushes the ArcBox production guest template image to the
# lacogito namespace on Aliyun Container Registry (same registry as soothed
# in ../soothe).
#
# The real Dockerfile under docker/templates/prod/ is built here and
# published as a base image that downstream consumers (abctl, integration
# layers) pull instead of building locally.
#
# Trigger: GitHub Release published, or manual workflow_dispatch. Manual
# builds publish the configured IMAGE_VERSION (overridable via input) and
# move the `latest` tag to that build (toggleable, default on).
#
# The image is versioned standalone from the soothe-nano package: bump
# IMAGE_VERSION below whenever the guest image changes. On a release, the
# image is tagged with IMAGE_VERSION and `latest` is moved to that build.
#
# Image:
#   registry.cn-hangzhou.aliyuncs.com/lacogito/soothe-nano-vm-prod
#
# Secrets:
#   ALIYUN_REGISTRY_USERNAME / ALIYUN_REGISTRY_PASSWORD — registry push
#   credentials. Without them the build runs in build-only mode (no push).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_version:
        description: Image version tag to publish. Empty = configured IMAGE_VERSION.
        required: false
        default: ""
        type: string
      update_latest:
        description: Move the `latest` tag to this build.
        required: false
        default: true
        type: boolean

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: lacogito
  IMAGE_VERSION: "1.0"
  PYTHON_BASE: registry.cn-hangzhou.aliyuncs.com/lacogito/python:3.12-bookworm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # For buildx binary + cache-from: type=gha

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Dockerfile context exists
        run: |
          test -f docker/templates/prod/Dockerfile || { echo "Missing docker/templates/prod/Dockerfile"; exit 1; }
          echo "Context docker/templates/prod OK"

      - name: Resolve image version and tags
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.image_version }}
          INPUT_UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          # Effective version: manual override wins, else configured IMAGE_VERSION.
          override="$(printf '%s' "${INPUT_VERSION}" | tr -d '[:space:]')"
          if [ -n "${override}" ]; then
            version="${override}"
          else
            version="${IMAGE_VERSION}"
          fi
          echo "effective_version=${version}" >> "${GITHUB_OUTPUT}"

          # `latest` tag: always moved on release; on manual dispatch follow the
          # update_latest input (defaults to true).
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            update_latest=true
          else
            update_latest="${INPUT_UPDATE_LATEST}"
          fi
          echo "update_latest=${update_latest}" >> "${GITHUB_OUTPUT}"

          echo "Effective image version: ${version}"
          echo "Move latest tag: ${update_latest}"

      - name: Resolve registry publish eligibility
        id: publish
        env:
          REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          ready=false
          if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASS}" ]; then ready=true; fi
          echo "registry_secrets_ready=${ready}" >> "${GITHUB_OUTPUT}"
          echo "should_push=${ready}" >> "${GITHUB_OUTPUT}"

      - name: Warn when registry push is skipped
        if: ${{ steps.publish.outputs.registry_secrets_ready != 'true' }}
        run: |
          echo "::warning::Skipping registry push. Configure repository secrets ALIYUN_REGISTRY_USERNAME and ALIYUN_REGISTRY_PASSWORD to publish images."

      # Login before setup-buildx: docker/login-action rewrites DOCKER_CONFIG and would
      # otherwise drop the buildx builder config (see docker/build-push-action#1253).
      - name: Login to Aliyun Container Registry
        if: ${{ steps.publish.outputs.registry_secrets_ready == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/soothe-nano-vm-prod
          tags: |
            type=raw,value=${{ steps.resolve.outputs.effective_version }}
            type=raw,enable=${{ steps.resolve.outputs.update_latest }},value=latest
          labels: |
            org.opencontainers.image.title=soothe-nano ArcBox prod guest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: docker/templates/prod
          file: docker/templates/prod/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            PYTHON_BASE=${{ env.PYTHON_BASE }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          # Aliyun Container Registry rejects OCI attestation manifests
          # (application/vnd.oci.empty.v1+json) generated by provenance/sbom.
          # Read GHA cache when available; do not write (mode=max multi-platform
          # exports can exceed org cache quota and fail the job after a successful push).
          cache-from: type=gha

      - name: Output image digest
        run: |
          echo "### ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/soothe-nano-vm-prod" >> ${GITHUB_STEP_SUMMARY}
          echo "" >> ${GITHUB_STEP_SUMMARY}
          echo "| Property | Value |" >> ${GITHUB_STEP_SUMMARY}
          echo "|----------|-------|" >> ${GITHUB_STEP_SUMMARY}
          echo "| Release | ${{ github.event.release.tag_name || github.event_name }} |" >> ${GITHUB_STEP_SUMMARY}
          echo "| Image version | ${{ steps.resolve.outputs.effective_version }} |" >> ${GITHUB_STEP_SUMMARY}
          echo "| Latest tag | ${{ steps.resolve.outputs.update_latest }} |" >> ${GITHUB_STEP_SUMMARY}
          echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |" >> ${GITHUB_STEP_SUMMARY}
          echo "| Pushed | ${{ steps.publish.outputs.should_push }} |" >> ${GITHUB_STEP_SUMMARY}
          echo "| Platforms | linux/amd64, linux/arm64 |" >> ${GITHUB_STEP_SUMMARY}
